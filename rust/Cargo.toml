[package]
name = "wardite-benches"
version = "0.1.0"
edition = "2024"
publish = false

[features]
wasi = ["dep:base64", "dep:png", "dep:serde", "dep:serde_json"]

[dependencies]
base64 = { version = "0.22", optional = true }
png = { version = "0.18", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[[example]]
name = "xorshift"
crate-type = ["cdylib"]

[[example]]
name = "splitmix64"
crate-type = ["cdylib"]

[[example]]
name = "mandelbrot"
crate-type = ["cdylib"]

[[example]]
name = "monte_carlo_pi"
crate-type = ["cdylib"]

[[example]]
name = "crc8_stream"
crate-type = ["cdylib"]

[[example]]
name = "count_primes"
crate-type = ["cdylib"]

[[example]]
name = "base64_codec"
required-features = ["wasi"]

[[example]]
name = "png_grayscale"
required-features = ["wasi"]

[[example]]
name = "json_log_summary"
required-features = ["wasi"]
